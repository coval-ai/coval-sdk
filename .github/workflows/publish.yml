name: Publish SDK packages

on:
  push:
    tags: ["v*"]
  repository_dispatch:
    types: [sdk_release_retry]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing generated release tag to retry
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event.client_payload.tag || github.ref_name }}

permissions:
  contents: read

concurrency:
  group: sdk-publish-${{ github.event.client_payload.tag || inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  retry:
    name: Request existing release through the App
    if: github.event_name == 'workflow_dispatch' && vars.SDK_RELEASES_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Require main and a final release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
      - name: Create release automation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Dispatch existing release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" \
            -f event_type=sdk_release_retry -f "client_payload[tag]=$RELEASE_TAG"

  build:
    name: Validate and build both packages
    if: >-
      vars.SDK_RELEASES_ENABLED == 'true' &&
      github.event_name != 'workflow_dispatch' &&
      github.actor == 'coval-release-automation[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.9.4"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install SDK and release tools
        env:
          PYTHON_VERSION: "3.12"
        run: scripts/install
      - name: Verify generated release tag
        run: |
          git fetch origin main:refs/remotes/origin/main
          .venv/bin/python scripts/validate_release.py tag "$RELEASE_TAG"
      - name: Install TypeScript build tools
        run: npm ci --prefix typescript-sdk
      - name: Validate and package both SDKs
        run: scripts/check
      - name: Upload Python distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coval-sdk-python
          path: dist/python/
          if-no-files-found: error
      - name: Upload npm package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coval-sdk-npm
          path: dist/npm/
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/coval-sdk/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coval-sdk-python
          path: dist/
      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/
          attestations: true
          skip-existing: true

  npm:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@coval/sdk
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coval-sdk-npm
          path: dist/
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@11.5.1
      - name: Detect an already published version
        id: registry
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          if npm view "@coval/sdk@$version" version --json > registry.json; then
            node --input-type=module - "$version" <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          assert.equal(JSON.parse(readFileSync('registry.json', 'utf8')), process.argv[2]);
          JS
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          else
            node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          assert.equal(JSON.parse(readFileSync('registry.json', 'utf8')).error.code, 'E404');
          JS
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Publish package
        if: steps.registry.outputs.publish == 'true'
        run: npm publish ./dist/*.tgz --access public
