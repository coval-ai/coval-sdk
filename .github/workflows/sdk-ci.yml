name: SDK CI

on:
  pull_request:
  push:
    branches:
      - main
    # Release tagging requires this successful run to match current main exactly.
    # Run every main commit so an unrelated follow-up cannot strand an SDK release.

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            scripts/package-lock.json
            typescript-sdk/package-lock.json
      - name: Exercise generated-file security boundaries
        run: node --test scripts/generated-files.test.mjs
      - name: Audit codegen dependencies
        run: |
          npm ci --prefix scripts
          npm audit --prefix scripts --audit-level=moderate
      - name: Build, test, and inspect package
        working-directory: typescript-sdk
        run: |
          npm ci
          npm audit --audit-level=moderate
          npm run build
          npm test
          npm pack --dry-run

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python-sdk/pyproject.toml
      - name: Install and test
        working-directory: python-sdk
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest
          python -m build
          python -m twine check dist/*

  release-tools:
    name: Release tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.9.4"
      - name: Install SDK and release tools
        env:
          PYTHON_VERSION: "3.12"
        run: scripts/install
      - name: Exercise semantic releases and publication guards
        run: .venv/bin/python -m pytest release_tests -q
